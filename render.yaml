services:
  - type: keyvalue
    name: easygenerator-cache
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: easygenerator-auth
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: easygenerator_auth
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: ASSISTANT_ENABLED
        value: 'true'
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: easygenerator-cache
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: IDENTITY_HASH_SECRET
        sync: false
