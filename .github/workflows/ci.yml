name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.0.6

jobs:
  quality:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node scripts/validate-render-blueprint.mjs

  unit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p test-results/unit test-results/coverage/contracts test-results/coverage/api test-results/coverage/web
      - run: NODE_V8_COVERAGE=${{ github.workspace }}/test-results/coverage/contracts pnpm --filter @easygenerator/contracts exec vitest run --reporter=junit --outputFile=../../test-results/unit/contracts.xml
      - run: NODE_V8_COVERAGE=${{ github.workspace }}/test-results/coverage/api pnpm --filter @easygenerator/api exec vitest run --reporter=junit --outputFile=../../test-results/unit/api.xml
      - run: NODE_V8_COVERAGE=${{ github.workspace }}/test-results/coverage/web pnpm --filter @easygenerator/web exec vitest run --reporter=junit --outputFile=../../test-results/unit/web.xml
      - name: Publish measured test summary
        if: always()
        run: node scripts/summarize-unit-tests.mjs test-results/unit >> "$GITHUB_STEP_SUMMARY" && node scripts/summarize-v8-coverage.mjs test-results/coverage >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: test-results/unit
          if-no-files-found: error
      - name: Upload V8 coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-v8-coverage
          path: test-results/coverage
          if-no-files-found: error

  integration:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @easygenerator/api test:integration
      - name: Ensure integration cleanup
        if: always()
        run: docker compose -f compose.test.yaml down --volumes

  build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker build --tag easygenerator-auth:ci .
      - run: node scripts/verify-production-image.mjs easygenerator-auth:ci

  browser:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Ensure browser cleanup
        if: always()
        run: docker compose -f compose.test.yaml down --volumes
